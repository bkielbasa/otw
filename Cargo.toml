[package]
name = "otw-vm"
version = "0.1.0"
edition = "2021"
description = "Open-source Windows 95 compatibility VM: PE loader, IAT dispatcher, and Win32 API layers"
license = "GPL-2.0-only"
publish = false
# `cargo run` runs the VM (src/bin/ has tools besides).
default-run = "otw-vm"

[dependencies]
# x86-only CPU backend for the VM. Other architectures are not needed yet.
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"], optional = true }
# Local time for the taskbar clock.
libc = { version = "0.2", optional = true }
# Hash maps without std (the bare-metal build).
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
# Floating point functions without std.
libm = "0.2"

# Optional host window for displaying captured guest frames. Kept out of the
# default build so the packaged static-pie binary stays dependency-free.
glow = { version = "0.16", optional = true }
glutin = { version = "0.32", default-features = false, features = ["glx", "x11"], optional = true }
glutin-winit = { version = "0.5", default-features = false, features = ["glx", "x11"], optional = true }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"], optional = true }

[features]
default = ["std"]
# Linux: std, the Unicorn CPU, the host's files, clock and network. Without
# it the library builds for bare metal (baremetal/), where the kernel
# provides those through `platform`.
std = ["dep:unicorn-engine", "dep:libc"]
# Embed the genuine Win95 NOTEPAD.EXE so the packaged binary is self-contained.
embedded-target = []
# Build the host-side OpenGL window and event loop.
display = ["std", "dep:glow", "dep:glutin", "dep:glutin-winit", "dep:winit"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true

# Release code with symbols and line tables, for profilers and debuggers.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
lto = "thin"

# Unicorn with locked instructions atomic across CPUs (threads of a 64-bit
# process run on CPUs of their own); see vendor/unicorn-engine-sys/OTW.md.
[patch.crates-io]
unicorn-engine-sys = { path = "vendor/unicorn-engine-sys" }
