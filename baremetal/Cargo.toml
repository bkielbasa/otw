[package]
name = "otw-kernel"
version = "0.1.0"
edition = "2021"
description = "OTW on bare metal: the kernel a UEFI machine boots"
license = "GPL-2.0-only"
publish = false

[[bin]]
name = "otw-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# OTW itself: the Win32 subsystem, the shell, FAT32 — built without std,
# with this kernel providing what it needs (`platform::System`).
otw-vm = { path = "..", default-features = false }

[features]
# Read a big file from drive C: at boot, to measure the disk.
disk-test = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

# Not part of the host crate's build.
[workspace]
